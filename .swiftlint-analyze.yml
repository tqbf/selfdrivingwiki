# SwiftLint ANALYZER config — used only by `make lint-analyze`, never by
# `make lint`.
#
# Why a separate file: analyzer rules need a full compiler log to run, so they
# cannot live in .swiftlint.yml alongside the normal gate. `swiftlint lint`
# silently skips any analyzer rule it finds, which would make the main config
# claim to enforce something it never checks.
#
# These rules are ADVISORY. They are not wired into CI and have no baseline —
# a full clean build plus whole-program analysis runs to tens of minutes, far
# too slow for a per-PR gate, and both rules have blind spots. Run this before a
# cleanup pass, read the output with judgement, and do NOT treat a hit as
# automatically actionable.
#
# Known false-positive classes in this codebase, found by actually reading the
# output rather than trusting the count:
#
#   * Codable wire models. `ACPRegistryResponse.version`,
#     `ACPRegistryAgent.icon` and friends are decoded from JSON and never read
#     in Swift, so unused_declaration reports them. Deleting one silently
#     changes decoding. ACPRegistry.swift alone accounts for 12 hits, and one
#     of its properties is even commented "Ignored on decode" — i.e. known to be
#     unreferenced and deliberately kept.
#
#   * Test-only declarations, IF the compiler log was built without
#     `--build-tests`. Tests never get compiled, so nothing they exercise is in
#     the index and every test-only helper reads as dead. `make lint-analyze`
#     passes --build-tests for exactly this reason; a hand-rolled `swift build
#     -v` will not, and will produce a much longer and much wronger list.

only_rules:
  - unused_declaration
  - unused_import

included:
  - Sources
  - tools

excluded:
  - .build
  - build
  - tmp
  - Sources/WikiFSVersion   # generated by `make version`
  - Sources/WikiFSPrompts   # generated by `make prompts`

unused_declaration:
  # Leave `include_public_and_open` at its default (false). This is a
  # multi-module SwiftPM package: a `public` symbol in WikiFSCore that only
  # WikiFS calls looks unused from inside its own module, so turning this on
  # would flag most of the package's API surface.
  severity: warning

unused_import:
  severity: warning
  # MEASURED, not guessed. `import Foundation` accounted for 68 of the 112
  # unused_import hits on the first run, and acting on them would be actively
  # dangerous here: the analysis is macOS-only
  # (arm64-apple-macosx15.0), where AppKit and SwiftUI transitively re-export
  # Foundation. Those re-exports do
  # not exist on Linux, and this package retains an opt-in Linux diagnostic. An
  # import this rule calls redundant on macOS can be load-bearing in that diagnostic, so
  # Foundation is pinned rather than reported.
  always_keep_imports:
    - Foundation
  # NOT needed, though it looked like it would be: the `@_exported import`
  # shims (ModuleExports.swift, _Exports.swift, 10 lines) produced ZERO hits.
  # swiftlint understands @_exported and does not report those as unused.
