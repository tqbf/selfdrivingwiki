<!--
  SVG renderer package entry document. Static and read-only.

  Loaded through the renderer-package scheme with a restrictive CSP: no inline
  style, no inline script, no network origins. The companion viewer.js reads
  the authorized source once through the native input.read bridge and mounts
  the exact bytes as an inert data: image, the same display surface the
  retired built-in SVG renderer used. WebKit renders SVG images in a
  restricted image mode: script never runs, event handlers never bind, and
  external references never load, so the author-controlled bytes stay inert
  by construction.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SVG diagram</title>
    <script src="viewer.js" defer></script>
  </head>
  <body>
    <main>
      <h1>SVG diagram</h1>
      <p id="status" role="status">Loading the SVG document.</p>
      <p id="error" role="status" hidden></p>
      <div id="diagram"></div>
    </main>
  </body>
</html>
