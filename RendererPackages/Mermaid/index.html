<!--
  Mermaid renderer package entry document. Static and read-only.

  Loaded through the renderer-package scheme with a restrictive CSP: no inline
  style, no inline script, no network origins. The companion viewer.js boots
  the pinned mermaid engine, reads the authorized source once through the
  native input.read bridge, and mounts the rendered SVG. The engine asset
  also backs the package's fence-syntax validation contract (validate.js),
  so the bytes that render are the bytes that validate.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mermaid diagram</title>
    <script src="mermaid.min.js" defer></script>
    <script src="viewer.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Mermaid diagram</h1>
      <p id="status" role="status">Rendering the diagram.</p>
      <p id="error" role="status" hidden></p>
      <div id="diagram"></div>
    </main>
  </body>
</html>
