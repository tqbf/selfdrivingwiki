# SwiftLint — scoped deliberately narrow.
#
# This config enables ONLY custom rules (`only_rules: [custom_rules]`). It is
# not a general Swift style gate. Turning on SwiftLint's ~200 default rules
# against this codebase would emit thousands of line_length / identifier_name /
# type_body_length violations and drown the one rule that exists to catch a
# class of bug that has actually bitten us. Broaden later if you want, but do it
# as its own change with its own baseline.

only_rules:
  - custom_rules

# Production code only. Tests/ is excluded on purpose: a `try?` in test setup
# fails the test anyway, whereas a `try?` in Sources/ silently drops data.
included:
  - Sources
  - tools

excluded:
  - .build
  - build
  - tmp
  - Sources/WikiFSVersion   # generated by `make version`
  - Sources/WikiFSPrompts   # generated by `make prompts`

# Pre-existing violations are recorded here so the rule can run at `error`
# severity without failing on day one. Only NEW violations fail.
#
# The baseline is a ratchet, not a permit: when you fix a `try?`, regenerate
# with `make lint-baseline` so the count can only go down.
#
# GOTCHA: baseline entries record the violation's MESSAGE text, so editing
# `message:` or `regex:` below invalidates all of them at once and every
# grandfathered violation comes roaring back. Always follow such an edit with
# `make lint-baseline` in the same commit.
baseline: .swiftlint-baseline.json

custom_rules:
  silent_try_optional:
    name: "Silent try?"
    # `match_kinds: [keyword]` is what makes this safe. SourceKit lexes `try`
    # as a keyword only in real code, so occurrences inside comments, doc
    # comments and string literals are excluded structurally — no regex
    # gymnastics and no false positives on prose that discusses `try?`.
    #
    # `(?-s)` stops `.`/quantifiers spanning newlines (SwiftLint compiles
    # custom-rule regexes with the `s` and `m` flags on by default).
    regex: '(?-s)\btry[ \t]*\?'
    match_kinds:
      - keyword
    message: >-
      Bare `try?` swallows the error silently. Use
      `do { try … } catch { DebugLog.<channel>(…) }` so the failure is visible
      in Console.app. If ignoring the error is genuinely correct, put a comment
      saying why, then `// swiftlint:disable:next silent_try_optional` directly
      above the offending line — in that order, since disable:next takes the
      very next line. See AGENTS.md.
    severity: error
