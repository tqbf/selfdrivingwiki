# SwiftLint — scoped deliberately narrow.
#
# This is a BUG-CLASS GATE, not a general Swift style gate. Turning on
# SwiftLint's ~200 default rules against this codebase would emit thousands of
# line_length / identifier_name / type_body_length violations and drown the
# rules that exist to catch classes of bug that have actually bitten us.
#
# Admission test for a new rule: does a violation mean *a failure disappears
# silently*, or that an AGENTS.md invariant is broken? If it's merely "this
# could be written more prettily", it does not belong here.
#
# Every rule here was measured against the tree before being enabled. Rules
# fall into two groups, and the distinction matters when you add one:
#
#   FREE RATCHETS — 0 violations, so the gate is pure prevention.
#   BASELINED     — a real pre-existing count, grandfathered in
#                   .swiftlint-baseline.json so only NEW ones fail. The
#                   baseline is a ratchet, not a permit: fix some, then
#                   regenerate with `make lint-baseline` so it can only shrink.
#
# GOTCHA: `only_rules` and `opt_in_rules` are mutually exclusive. To turn on a
# built-in rule, add its name to `only_rules` below — there is no second list.

only_rules:
  - custom_rules

  # ---- Free ratchets (0 violations as of this commit) ----------------------
  - force_cast                        # `as!` — 0 in Sources/ + tools/
  - weak_delegate                     # strong delegate = retain cycle; we have
                                      # many NSViewRepresentable Coordinators
  - notification_center_detachment    # deinit-time removeObserver misuse
  - unused_setter_value               # a setter that drops newValue on the floor
  - overridden_super_call             # missing super in a lifecycle override
  - prohibited_super_call             # super called where it must not be
  - duplicate_imports                 # was 8, all a doubled `import
                                      # WikiFSEngine`; fixed rather than
                                      # baselined, so this is free now
  # 3 pre-existing sites, all annotated at the call site with a reason rather
  # than baselined — they are once-only, app-lifetime willTerminate observers
  # where there is genuinely nothing to remove. Anywhere else, discarding the
  # token means the observer can never be detached.
  - discarded_notification_center_observer

  # ---- Baselined (see .swiftlint-baseline.json) ----------------------------
  #
  # These pass the admission test because of HOW this app is deployed. A trap
  # inside the File Provider extension, the wikid XPC service or a background
  # Task is not a tidy crash dialog — it is a silent death with no crash report
  # (that failure mode is common enough here to have its own procedure:
  # docs/skills/debugging-with-lldb/SKILL.md). "It crashes, so you'll notice"
  # does not hold outside the main app process.
  - force_unwrapping                  # 52
  - implicitly_unwrapped_optional     # 14
  - force_try                         # 7 — all `static let … = try!
                                      # NSRegularExpression(pattern: <literal>)`,
                                      # which is defensible; baselining them
                                      # still blocks the indefensible ones

# Production code only. Tests/ is excluded on purpose: a `try?` in test setup
# fails the test anyway, whereas a `try?` in Sources/ silently drops data.
included:
  - Sources
  - tools

excluded:
  - .build
  - build
  - tmp
  - Sources/WikiFSVersion   # generated by `make version`
  - Sources/WikiFSPrompts   # generated by `make prompts`

# Pre-existing violations are recorded here so the rule can run at `error`
# severity without failing on day one. Only NEW violations fail.
#
# The baseline is a ratchet, not a permit: when you fix a `try?`, regenerate
# with `make lint-baseline` so the count can only go down.
#
# GOTCHA: baseline entries record the violation's MESSAGE text, so editing
# `message:` or `regex:` below invalidates all of them at once and every
# grandfathered violation comes roaring back. Always follow such an edit with
# `make lint-baseline` in the same commit.
baseline: .swiftlint-baseline.json

custom_rules:
  silent_try_optional:
    name: "Silent try?"
    # `match_kinds: [keyword]` is what makes this safe. SourceKit lexes `try`
    # as a keyword only in real code, so occurrences inside comments, doc
    # comments and string literals are excluded structurally — no regex
    # gymnastics and no false positives on prose that discusses `try?`.
    #
    # `(?-s)` stops `.`/quantifiers spanning newlines (SwiftLint compiles
    # custom-rule regexes with the `s` and `m` flags on by default).
    regex: '(?-s)\btry[ \t]*\?'
    match_kinds:
      - keyword
    message: >-
      Bare `try?` swallows the error silently. Use
      `do { try … } catch { DebugLog.<channel>(…) }` so the failure is visible
      in Console.app. If ignoring the error is genuinely correct, put a comment
      saying why, then `// swiftlint:disable:next silent_try_optional` directly
      above the offending line — in that order, since disable:next takes the
      very next line. See AGENTS.md.
    severity: error

  diagnostic_print:
    name: "print() for diagnostics"
    # Same `match_kinds` trick as above: `print` lexes as an identifier only in
    # real code, so the prose mention in ReaderTiming.swift is excluded
    # structurally. `(?<![.\w])` avoids matching `sprint(` and member calls like
    # `formatter.print(`. Known loophole: `Swift.print(…)` slips past the
    # lookbehind — use `swiftlint:disable:next`, not that, as the escape hatch.
    regex: '(?-s)(?<![.\w])print[ \t]*\('
    match_kinds:
      - identifier
    # Per-rule `excluded` is a REGEX on the file path, not a glob. Real CLI
    # stdout is the documented exception in AGENTS.md, so the executable targets
    # whose whole job is printing are exempt.
    excluded: ".*/(wikictl|versiongen|keychaingen|FuzzHarness|podcast-token-helper)/.*"
    message: >-
      `print` goes nowhere when the app is launched by launchd, XPC or the File
      Provider — the diagnostic is simply lost. Route it through the appropriate
      `DebugLog.<channel>` (os_log → Console.app, subsystem
      com.selfdrivingwiki.debug) so it is visible no matter how the process
      started. Genuine CLI command output belongs in wikictl/ or tools/.
      See AGENTS.md.
    severity: error

  raw_sql_begin:
    name: "Raw BEGIN"
    # `match_kinds: [string]` because SQL lives in string literals. This is what
    # keeps the three prose mentions of "BEGIN IMMEDIATE" in GRDBWikiStore's doc
    # comments from tripping the rule.
    regex: '(?i)(?-s)\bBEGIN[ \t]+(IMMEDIATE|EXCLUSIVE|DEFERRED|TRANSACTION)\b'
    match_kinds:
      - string
    message: >-
      A raw BEGIN breaks savepoint nesting — an inner one hits "cannot start a
      transaction within a transaction" and an outer rollback silently discards
      the inner work. Compose multi-step writes through `withTransaction`.
      See docs/skills/sqlite-concurrency/SKILL.md.
    severity: error

  entry_macro:
    name: "@Entry macro"
    regex: '(?-s)@Entry\b'
    # `typeidentifier` is what SourceKit lexes an unresolved macro name as (the
    # macro doesn't expand under SwiftPM, which is the whole point of the rule).
    # `attribute.id` is listed too in case a future toolchain resolves it.
    # Without this, the rule fires on prose mentioning @Entry in comments.
    match_kinds:
      - typeidentifier
      - attribute.id
    message: >-
      `@Entry` resolves only under Xcode's build system; this repo must build
      with `swift build` from the command line. Use the manual
      `EnvironmentKey`/`FocusedValueKey` pattern instead. See AGENTS.md.
    severity: error

  # The two rules below are BASELINED (61 and 8 sites — a raw text search says
  # 85 and 10, but `match_kinds` correctly discounts 26 prose mentions in
  # comments and string literals). Neither is a bug on its
  # own — both are legitimate, necessary tools in a codebase that bridges SQLite,
  # AppKit and actors. The point is that each one is a hand-written proof the
  # compiler cannot check, so it should be a deliberate act with a reason, not
  # something that spreads by copy-paste. The baseline makes the 86th one a
  # decision.
  #
  # Both use `match_kinds: [attribute.builtin]` and match only the ATTRIBUTE, not
  # the whole phrase — `@unchecked` via lookahead rather than spanning
  # `@unchecked Sendable`. That keeps both rules resting on a single syntax kind
  # instead of two, so there's one way for them to silently stop matching rather
  # than two. Verified against a fixture: fires on the declaration, not on prose
  # in comments or on the phrase inside a string literal.
  unchecked_sendable:
    name: "@unchecked Sendable"
    regex: '(?-s)@unchecked(?=[ \t]+Sendable)'
    match_kinds:
      - attribute.builtin
    message: >-
      `@unchecked Sendable` asserts thread safety the compiler cannot verify.
      Prefer making the type actually Sendable (value types, `let` properties,
      or an actor). If the unchecked conformance is genuinely required, state
      the invariant that makes it safe — what lock or isolation covers the
      mutable state — in a comment, then
      `// swiftlint:disable:next unchecked_sendable`.
    severity: error

  nonisolated_unsafe:
    name: "nonisolated(unsafe)"
    regex: '(?-s)nonisolated(?=\(unsafe\))'
    match_kinds:
      - attribute.builtin
    message: >-
      `nonisolated(unsafe)` opts a declaration out of actor isolation checking
      entirely — it is an assertion, not a fix. Prefer actor isolation, a
      `let` constant, or a lock-guarded box. If it is genuinely required, say
      why in a comment, then
      `// swiftlint:disable:next nonisolated_unsafe`.
    severity: error
