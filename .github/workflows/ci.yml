name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  # Enforces the AGENTS.md "no bare try?" rule via a SwiftLint custom rule.
  # Deliberately standalone: it needs no Swift build, no codegen and no cache,
  # so it reports in ~1 min in parallel with the (much slower) test jobs.
  #
  # Pre-existing violations are grandfathered in .swiftlint-baseline.json —
  # only NEW ones fail. Regenerate with `make lint-baseline` after fixing some.
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        # Poured from a bottle (prebuilt), so this is seconds, not a source build.
        run: brew install swiftlint
      - name: Lint (new bare try? fails the build)
        # github-actions-logging surfaces each violation as an inline
        # annotation on the PR diff instead of burying it in the log.
        run: swiftlint lint --strict --reporter github-actions-logging

  skills:
    # Validate skill metadata independently from the Swift and Python jobs.
    # The script declares its PyYAML dependency with PEP 723 inline metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv for skill validation
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Validate skill metadata
        run: uv run tools/validate_skills.py

  swift:
    # The broad required step runs WikiFSCoreTests with selected blocking suites
    # skipped. Separate opt-in steps set WIKIFS_APP_TESTS=1 and run targeted
    # WikiFSAppTests suites; CI does not yet run that app-test target in full.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Select Xcode (mlx-swift needs Swift 6.3)
        run: |
          # macos-latest may default the `swift` command to the CLT toolchain
          # (Swift 6.1), but mlx-swift 0.31.x requires 6.3. Force Xcode.
          ls /Applications/Xcode*.app 2>/dev/null
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)" || true
          swift --version || xcrun swift --version
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          which swift || echo "swift not in PATH"
          swift --version || xcrun swift --version
          # Failure-window marker for the crash-diagnostics capture steps at
          # the end of this job: only .ips files newer than this are collected.
          touch "$RUNNER_TEMP/crash-window-start"
      - name: Generate codegen files (version + prompts + keychain)
        run: make version prompts keychain
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # Key on Package.resolved ONLY. The previous key also hashed
          # `Sources/**/*.swift`, producing one cache entry per commit and
          # blowing past GitHub's 10 GB/repo LRU — every run evicted and
          # cold-built MLX C++ (~1374 units, ~15 min). One entry per dep set
          # stops the eviction; warm build is ~2 min.
          key: ${{ runner.os }}-swift-v3-${{ hashFiles('Package.resolved', 'Package.swift') }}
      - name: Build
        # The "Select Xcode" step above ran `sudo xcode-select -s`, so one
        # toolchain works directly. The previous `if xcrun swift build
        # 2>/dev/null; else swift build` probe swallowed failure reasons and
        # the `else` branch could trigger a second full recompile.
        run: xcrun swift build
      - name: Test WikiFSCoreTests minus blocking suites
        # The selected core tests run quickly via in-memory SQLite fixtures (#658).
        # HOWEVER: a set of suites block the cooperative thread pool on CI's
        # 3-vCPU runner, causing a deadlock that .timeLimit cannot interrupt
        # (DispatchSemaphore.wait in production code, Process.waitUntilExit,
        # WKWebView/NSWindow on @MainActor). These suites pass locally (8+ vCPU)
        # and require local coverage before every PR (`make test` for the default
        # graph; WIKIFS_APP_TESTS=1 for app suites). CI skips them here to avoid
        # the 30-min timeout. See plans/ci-speedup.md, #732, #448.
        #
        # Keep SwiftPM's worker count at one (#1003, #1021): the core suite
        # otherwise intermittently crashes its shared test helper under load.
        # timeout-minutes: 30 is a safety net for a cache-miss full rebuild.
        #
        # Two more suites are skipped for a different reason (#1338): both
        # spawn real subprocesses under wall-clock deadlines, and full-suite
        # load on the 3-vCPU runner starves the child past its deadline
        # (zsh login startup > 10 s on main 2026-09-19; fixture startup
        # > 30 s on 2026-09-28). They are not disabled — they stay required
        # locally before every PR (`make test`).
        timeout-minutes: 30
        env:
          SKIP: 'CLITantivyLegResolverTests|TantivySmokeTests|TantivyShadowIndexTests|TantivyBM25LegCutoverTests|TantivyAutocompleteTests|RunAwaitsTurnTests|SourceEmbeddingSearchTests|PdfExtractionServiceTests|YouTubeEmbedWebViewTests|QuoteHighlightWebViewTests|SplitDiffSnapshotTests|BlobSchemeHandlerTests|ReaderRenderPerfTests|TransclusionEmbedTests|PageDetailViewHostedTests|PageVersionTests|EnumeratorDeletionTests|BlobVacuumTests|AgentCASTests|GenerationGateLaneTests|WorkspaceStagingTests|WorkspaceMergeCompletenessTests|IngestIsolationTests|IngestGateTests|ChatSummaryTests|ProjectionTreeTests|SessionManagerTests|SidebarDropBuilderIntegrationTests|MediaEmbedPlayerTests|Phase6PinningModelTests|DropLinkTextViewDropTests|ComposerTextViewTests|EditorAutocompleteHostedTests|ComposerAutocompleteHostedTests|ChatAutocompleteSelectionTests|ChatAutocompletePanelPlacementTests|ActivityPermissionPendingRowTests|AddressBarLayoutHostedTests|BookmarkInsertPositionTests|SidebarDragPasteboardBridgeTests|SidebarSelectAllShortcutTests|SourceWebAnchorTests|FootnoteAnchorTests|RetryStuckRegressionTests|ExternalWriteBookmarkRefreshTests|ExternalWriteDraftRefreshTests|RuntimeCommandLocatorIntegrationTests|ManagedExtractorProcessExecutorTests'
        run: xcrun swift test --parallel --num-workers 1 --filter WikiFSCoreTests --skip "$SKIP"
      - name: Test serialized Cordis search suites
        # Real Tantivy and CLI search can starve a small cooperative pool when
        # they run with the broad suite. Keep this required gate at one worker.
        timeout-minutes: 15
        env:
          WIKIFS_APP_TESTS: "1"
        run: SWIFT_TEST_NUM_WORKERS=1 scripts/test-optin-app-tests-reconciled.sh --expect SessionManagerTests --filter 'SearchCordisBoundaryPolicyTests|SessionManagerTests|CLITantivyLegResolverTests|TantivyAutocompleteTests|TantivyBM25LegCutoverTests'
      - name: Test opt-in chat lifecycle suites
        # This opt-in app target contains source-contract and daemon lifecycle
        # tests only. It does not host AppKit or WebKit views, so it avoids the
        # known aggregate SwiftPM helper wedge while keeping the Phase 7
        # compatibility guard and persisted chat lifecycle coverage live.
        # WikiChangeBridgeTests joins this step because it pins #1374 — the
        # per-wiki Darwin subscription set that went stale for a wiki created
        # while the app ran. It is non-AppKit and non-WebKit and runs in well
        # under a second.
        timeout-minutes: 15
        env:
          WIKIFS_APP_TESTS: "1"
        run: SWIFT_TEST_NUM_WORKERS=1 scripts/test-optin-app-tests-reconciled.sh --expect ChatPresentationAPIManifestTests --filter 'ChatPresentationAPIManifestTests|DaemonChatUsageTests|DaemonChatControllerMetadataTests|DaemonChatControllerTests|DaemonWorkloadClientTimeoutTests|WikiChangeBridgeTests'
      - name: Test Phase 5 portable WebKit-facing security suites
        # This enables the macOS app-test target, then runs only the portable
        # Phase 5 bridge, package-scheme, external-activation, and host/session
        # lifecycle suites. It deliberately excludes RendererSessionIsolationTests
        # (real WebKit data stores and windows) and RendererHostedWebKitHarnessTests
        # (real HTTP/WSS receivers plus a login-keychain TLS identity). Ordinary CI
        # therefore does not claim live WebSocket or storage-isolation coverage.
        timeout-minutes: 15
        env:
          WIKIFS_APP_TESTS: "1"
        run: SWIFT_TEST_NUM_WORKERS=1 scripts/test-optin-app-tests-reconciled.sh --expect 'configuration factory creates fresh ephemeral components' --filter 'RendererPackageSchemeHandlerTests|RendererContentWorldBridgeTests|RendererExternalLinkRedemptionGateTests|WikiAppWebViewSessionTests|WikiAppWebViewTests'
      - name: Test daemon store integration suites
        # The daemon store integration tier: executor, RemoteWikiStore, the
        # concurrency and dedupe outcome contracts, session bootstrap, store
        # events, and the XPC sink (AC.2, AC.4, AC.10).
        #
        # Deliberately EXCLUDED: the File Provider projection socket-fixture
        # suites (ProjectionTreeTests, EnumeratorStoreFailureTests,
        # EnumeratorDeletionTests, ZeroByteSourceProjectionTests,
        # FileProviderReimportCreateTests, WikiStrategyProjectionTests) and
        # the two new projection suites (ProjectionBoundedQueryTests,
        # ProjectionLargeContentTests). All of them wedge this step at test
        # bundle startup on CI with zero output — reproduced with ONLY the
        # six suites that predate PR #1484 (run 45364281147), so the
        # CI-hostility predates the branch; it is the same
        # swiftpm-testing-helper wedge family as #1051/#1422 and needs its
        # own root-cause pass. They stay developer-machine-gated via
        # scripts/test-optin-app-tests-reconciled.sh (see the P7 progress
        # note).
        #
        # The store tier passes (~98 tests), but the swiftpm-testing-helper
        # traps with SIGTRAP MID-RUN — 2026-11-26 forensics on run
        # 45374149667: 75 tests started, 72 passed, 4 of 7 suites finished
        # when the helper exited. The earlier "teardown after all tests
        # pass" reading came from buffered output, not evidence. No stack
        # was captured (the run has zero artifacts) and three local runs of
        # this exact filter are green on an older toolchain, so the trap is
        # unreproduced. continue-on-error keeps this coverage running on
        # every push; the crash-diagnostics steps at the end of this job
        # collect .ips reports, runner logs, and a dSYM so the next trap
        # ships a symbolication-ready bundle. No evidence connects this
        # trap to the projection wedge above.
        continue-on-error: true
        timeout-minutes: 15
        env:
          WIKIFS_APP_TESTS: "1"
        run: SWIFT_TEST_NUM_WORKERS=1 scripts/test-optin-app-tests-reconciled.sh --expect RemoteWikiStoreTests --filter 'DaemonStoreCommandExecutorTests|RemoteWikiStoreTests|RemoteStoreConcurrencyTests|RemoteStoreDedupeTests|RemoteStoreSessionBootstrapTests|DaemonStoreEventTests|WikiDaemonEventSinkTests'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - name: Generate and verify the D2 renderer package
        # The D2 package is generated on demand (no vendored bytes in the repo).
        # This is the main network-using test step: it downloads the pinned
        # upstream source tarball, builds the WASM with the locked recipe
        # (pure-Go layout engines, so no JS eval is needed), verifies the
        # supply-chain gate (including a tamper leg), validates the generated
        # package, and runs the offline D2 suites plus the CSP boundary pin.
        # (setup-go above and the binaryen download below also fetch from the
        # network.) Hosted WebKit D2 suites stay local-only by the same
        # exclusion policy as the other WebKit suites above.
        #
        # wasm-opt comes from the binaryen release the lock pins (132), not
        # brew: the runner's brew bottle resolves to a different binaryen for
        # this macOS build (131), and the generator fails closed on any
        # version mismatch. The tarball digest is pinned here so the CI
        # toolchain is as reproducible as the lock's other pins.
        timeout-minutes: 30
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-arm64-macos.tar.gz
          echo "98aad827847af7ef990ed7098d885725c8e5b5aae75073403635617ae4e259aa  /tmp/binaryen.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_132/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/binaryen-version_132/bin:$PATH"
          wasm-opt --version
          make d2-renderer-package
          make d2-renderer-package-check
          xcrun swift test --parallel --num-workers 1 --filter 'D2RendererPackageMatchingTests|D2ViewerTemplateTests|D2GeneratedPackageValidationTests|D2PackageLockTests|D2SourceNeutralityTests|RendererCapabilityBoundaryPolicyTests'

      - name: Collect crash diagnostics
        # Failure forensics for the swiftpm-testing-helper traps (the
        # #1051/#1422 wedge family and the store-tier SIGTRAP, run
        # 45374149667). Runs even on cancellation. Collects: .ips crash
        # reports written during this job, the opt-in runner's tee'd logs,
        # a unified-log window for the helper and the crash reporter, and
        # a dSYM for the package test bundle, so an .ips stack can be
        # symbolicated without a local rebuild.
        if: always()
        run: |
          set -u
          DIR="$RUNNER_TEMP/crash-diagnostics"
          mkdir -p "$DIR/crash-reports" "$DIR/logs" "$DIR/unified-log"
          MARKER="$RUNNER_TEMP/crash-window-start"
          [ -f "$MARKER" ] || touch "$MARKER"
          START="$(stat -f '%Sm' -t '%Y-%m-%d %H:%M:%S' "$MARKER")"

          find "$HOME/Library/Logs/DiagnosticReports" \
            -type f -name '*.ips' -newer "$MARKER" -print 2>/dev/null | \
            while IFS= read -r f; do cp "$f" "$DIR/crash-reports/"; done
          echo "crash reports collected: $(ls "$DIR/crash-reports" | wc -l | tr -d ' ')"

          cp tmp/test-logs/*.log "$DIR/logs/" 2>/dev/null || echo "no opt-in runner logs"

          log show --start "$START" --style compact \
            --predicate 'process == "swiftpm-testing-helper" OR process == "swift" OR eventMessage CONTAINS[c] "crash"' \
            > "$DIR/unified-log/window.log" 2>&1 || true
          tail -c 20000000 "$DIR/unified-log/window.log" \
            > "$DIR/unified-log/window.tmp" \
            && mv "$DIR/unified-log/window.tmp" "$DIR/unified-log/window.log"
          gzip -f "$DIR/unified-log/window.log" || true

          BUNDLE="$(find .build -maxdepth 5 -name '*.xctest' 2>/dev/null | head -1)"
          if [ -n "$BUNDLE" ]; then
            BIN="$(ls "$BUNDLE/Contents/MacOS/"* 2>/dev/null | head -1)"
            {
              file "$BIN"
              dwarfdump --uuid "$BIN"
            } > "$DIR/test-bundle-identity.txt" 2>&1 || true
            dsymutil "$BIN" -o "$DIR/$(basename "$BUNDLE" .xctest).dSYM" \
              || echo "dsymutil failed (non-fatal)" >> "$DIR/test-bundle-identity.txt"
          else
            echo "no .xctest bundle under .build" > "$DIR/test-bundle-identity.txt"
          fi

          {
            echo "### Crash diagnostics"
            echo ""
            echo "Crash reports collected: $(ls "$DIR/crash-reports" | wc -l | tr -d ' ')"
            echo "Runner logs collected: $(ls "$DIR/logs" | wc -l | tr -d ' ')"
            echo "Download the crash-diagnostics artifact for .ips stacks, the unified-log window, and the dSYM."
          } >> "$GITHUB_STEP_SUMMARY"

          tar -czf "$RUNNER_TEMP/crash-diagnostics.tgz" -C "$RUNNER_TEMP" crash-diagnostics

      - name: Upload crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-diagnostics.tgz
          if-no-files-found: ignore
          retention-days: 14

  # Linux is not a supported product platform. The retained opt-in diagnostic
  # is `make test-linux`; it is not a pull-request or release gate. Keep this
  # workflow free of a `linux-swift` required check so Linux failures cannot
  # block macOS readiness.

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pdf2md
    steps:
      - uses: actions/checkout@v4
      - name: Install uv for Python checks
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check pdf2md tests/
      - name: Type check
        run: uv run pyright pdf2md tests/
      - name: Fast tests (exclude VLM suite)
        run: uv run pytest tests/ -v --ignore=tests/test_vlm.py
