// Search family (step 2, plans/app-daemon-wire-contract.md §"Search family
// design"). Typed RPCs replacing the app's SearchRPCWire JSON; the CLI
// search domain socket is a separate transport and stays unchanged.
//
// Before serving, the daemon synchronizes the per-wiki search runtime with
// the current store change token, so reads reflect observable committed
// writes.
syntax = "proto3";

package wikid.appdaemon.v1;

import "wikid/appdaemon/v1/common.proto";

option swift_prefix = "AppDaemon";

message SearchRequest {
  WikiId wiki_id = 1;
  string query = 2;
  // Empty list = all supported kinds (legacy absent/empty behavior).
  repeated SearchDocumentKind kinds = 3;
  // Result count bound; the daemon also bounds encoded size.
  uint32 limit = 4;
}

// One document-target arm replaces the composite `kind:ULID` identifier
// and separate kind string.
message SearchDocumentTarget {
  oneof target {
    PageId page = 1;
    SourceId source = 2;
    ChatId chat = 3;
  }
}

// Ordered by descending score.
message SearchHit {
  SearchDocumentTarget target = 1;
  string title = 2;
  double score = 3;
}

message SearchReply {
  // Empty = success with no hits.
  repeated SearchHit hits = 1;
}

message AutocompleteRequest {
  WikiId wiki_id = 1;
  string prefix = 2;
  // Edit distance, clamped to 0–255 as on XPC.
  uint32 edit_distance = 3;
  repeated SearchDocumentKind kinds = 4;
  uint32 limit = 5;
}

message AutocompleteReply {
  // Ordered by descending score.
  repeated AutocompleteHit hits = 1;
}

message AutocompleteHit {
  SearchDocumentTarget target = 1;
  string title = 2;
  double score = 3;
}

// Document kinds. Values are stable; only append. Unknown numeric values
// map to UNSPECIFIED and fail typed.
enum SearchDocumentKind {
  SEARCH_DOCUMENT_KIND_UNSPECIFIED = 0;
  SEARCH_DOCUMENT_KIND_PAGE = 1;
  SEARCH_DOCUMENT_KIND_SOURCE = 2;
  SEARCH_DOCUMENT_KIND_CHAT = 3;
}

// The daemon-scoped backfill command (replaces the legacy upgrade-start
// selector). An explicit second start is not a transport retry.
message UpgradeSearchIndexRequest {
  WikiId wiki_id = 1;
}

message UpgradeSearchIndexReply {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // Started (including joining an existing run).
    OUTCOME_STARTED = 1;
    // The index is already current; nothing to do.
    OUTCOME_NOT_NEEDED = 2;
    // The embedder is unavailable; retry is the caller's explicit choice.
    OUTCOME_EMBEDDER_UNAVAILABLE = 3;
  }

  Outcome outcome = 1;
  // Scanned item total at start (zero when not needed/unavailable).
  uint64 scanned_total = 2;
}

// Search-upgrade progress events. Attached to SubscribeEvents as its own
// search family (EVENT_FAMILY_SEARCH = 17, outside the existing
// reservation — see the design section). Not a store commit; must not
// advance a store reconciliation position.
message SearchUpgradeProgress {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_PAGES = 1;
    PHASE_SOURCES = 2;
    PHASE_CHATS = 3;
  }

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_RUNNING = 1;
    STATE_COMPLETE = 2;
    STATE_FAILED = 3;
  }

  WikiId wiki_id = 1;
  Phase phase = 2;
  State state = 3;
  uint64 done = 4;
  uint64 total = 5;
  // Present when state is FAILED; safe diagnostic text.
  optional string failure_summary = 6;
}
