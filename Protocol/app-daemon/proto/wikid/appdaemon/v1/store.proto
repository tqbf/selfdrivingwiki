    string user_text = 1;
    string system_init_model = 2;
    string assistant_text = 3;
    string thinking = 4;
    string thinking_delta = 5;
    string assistant_text_delta = 6;
    ToolUse tool_use = 7;
    ToolResult tool_result = 8;
    Subagent subagent = 9;
    Result result = 10;
    bool message_stop = 11;
    TurnFailed turn_failed = 12;
    string raw = 13;
  }
  message ToolUse { string name = 1; string input_summary = 2; }
  message ToolResult { bool is_error = 1; optional string summary = 2; }
  message Subagent { string subagent_type = 1; string description = 2; bool is_completion = 3; }
  message Result { bool is_error = 1; string text = 2; }
  message TurnFailed { string reason = 1; }
}
message ChatTranscriptMessageItem {
  string message_id = 1;
  ChatTurnId turn_id = 2;
  ChatTranscriptMessageRole role = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
}
