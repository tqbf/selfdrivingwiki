message WikiStrategyState {
  optional WikiStrategy strategy = 1;
  optional WikiStrategyRevision revision = 2;
}
message SourceVersionId { string raw_value = 1; }
message SourceMarkdownVersionId { string raw_value = 1; }
message SourceVersion {
  string id = 1;
  SourceId source_id = 2;
  optional string parent_id = 3;
  optional string blob_hash = 4;
  optional string mime_type = 5;
  optional string activity_id = 6;
  optional string external_identity = 7;
  google.protobuf.Timestamp fetched_at = 8;
}
message SourceMarkdownVersion {
  SourceMarkdownVersionId id = 1;
  SourceId source_id = 2;
  optional SourceMarkdownVersionId parent_id = 3;
  string content = 4;
  SourceMarkdownOrigin origin = 5;
  optional string note = 6;
  google.protobuf.Timestamp created_at = 7;
  optional string activity_id = 8;
  optional SourceVersionId source_version_id = 9;
  optional string blob_hash = 10;
  string mime_type = 11;
  optional string technique = 12;
}
message SourceMarkdownVersionHeader {
  string id = 1;
  string source_id = 2;
  optional string parent_id = 3;
  SourceMarkdownOrigin origin = 4;
  optional string note = 5;
  google.protobuf.Timestamp created_at = 6;
  optional string activity_id = 7;
  optional string source_version_id = 8;
  optional string blob_hash = 9;
  string mime_type = 10;
  optional string technique = 11;
}

// === Page versions, page metadata, and workspaces ===
message PageVersionId { string value = 1; }
message WorkspaceId { string value = 1; }
message ActivityId { string value = 1; }
