message LogEntry {
  PageId id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Kind kind = 3;
  string title = 4;
  optional string note = 5;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_INGEST = 1;
    KIND_QUERY = 2;
    KIND_LINT = 3;
  }
}
// TODO(step-2-review): Existing operation contracts use this transport ID wrapper; Swift LogEntry.id is PageID.
message LogEntryId { string value = 1; }
message ParsedLink {
  LinkType link_type = 1;
  string target = 2;
  optional string fragment = 3;
  string link_text = 4;
  bool is_embed = 5;
  optional string version_pin = 6;
  enum LinkType {
    LINK_TYPE_UNSPECIFIED = 0;
    LINK_TYPE_PAGE = 1;
    LINK_TYPE_SOURCE = 2;
    LINK_TYPE_CHAT = 3;
  }
}
message ResourceChangeEvent {
  WikiId wiki_id = 1;
  optional ResourceKind kind = 2;
  string id = 3;
  ChangeKind change = 4;
  uint64 seq = 5;
}
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_PAGE = 1;
  RESOURCE_KIND_SOURCE = 2;
  RESOURCE_KIND_SYSTEM_PROMPT = 3;
  RESOURCE_KIND_WIKI_INDEX = 4;
  RESOURCE_KIND_LOG = 5;
  RESOURCE_KIND_BOOKMARK = 6;
  RESOURCE_KIND_CHAT = 7;
  RESOURCE_KIND_STRATEGY = 8;
}
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_CREATED = 1;
  CHANGE_KIND_UPDATED = 2;
  CHANGE_KIND_DELETED = 3;
}

// === Bookmark tree and wiki strategy values ===
message BookmarkId { string value = 1; }
message BookmarkContent {
  oneof content {
