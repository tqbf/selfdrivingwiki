  CHAT_TRANSCRIPT_MESSAGE_ROLE_ASSISTANT = 2;
  CHAT_TRANSCRIPT_MESSAGE_ROLE_REASONING = 3;
}
message ChatTranscriptToolCallItem {
  string tool_call_id = 1;
  ChatTurnId turn_id = 2;
  string tool_name = 3;
  ChatToolCallStatus status = 4;
  optional string detail = 5;
  optional string output = 6;
  optional string permission_request_id = 7;
  google.protobuf.Timestamp updated_at = 8;
}
message ChatTranscriptSystemNoticeItem {
  string notice_id = 1;
  optional ChatTurnId turn_id = 2;
  ChatSystemNoticeKind kind = 3;
  string title = 4;
  string message = 5;
  google.protobuf.Timestamp created_at = 6;
}
message ChatTranscriptTurnFailureItem {
  string failure_id = 1;
  ChatTurnId turn_id = 2;
  ChatTurnFailureCategory category = 3;
  string message = 4;
  google.protobuf.Timestamp created_at = 5;
}
enum ChatToolCallStatus {
  CHAT_TOOL_CALL_STATUS_UNSPECIFIED = 0;
  CHAT_TOOL_CALL_STATUS_PENDING = 1;
  CHAT_TOOL_CALL_STATUS_RUNNING = 2;
  CHAT_TOOL_CALL_STATUS_COMPLETED = 3;
  CHAT_TOOL_CALL_STATUS_FAILED = 4;
  CHAT_TOOL_CALL_STATUS_CANCELLED = 5;
}
enum ChatSystemNoticeKind {
  CHAT_SYSTEM_NOTICE_KIND_UNSPECIFIED = 0;
  CHAT_SYSTEM_NOTICE_KIND_SESSION = 1;
  CHAT_SYSTEM_NOTICE_KIND_RECOVERY = 2;
  CHAT_SYSTEM_NOTICE_KIND_QUEUE = 3;
  CHAT_SYSTEM_NOTICE_KIND_DIAGNOSTICS = 4;
}
enum ChatTurnFailureCategory {
  CHAT_TURN_FAILURE_CATEGORY_UNSPECIFIED = 0;
  CHAT_TURN_FAILURE_CATEGORY_CANCELLED = 1;
