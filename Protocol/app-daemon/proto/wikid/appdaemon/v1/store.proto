// Store family (step 2, plans/app-daemon-wire-contract.md §"Store family
// design"). The full workload envelope set replacing the legacy
// storeOperation JSON dispatch: dedicated hot-path RPCs (GetPage/
// ListPages/UpsertPage — service methods added separately), four typed
// envelopes with exhaustive oneof dispatch (StoreSmall/StoreList/
// StoreBlob/StoreMutation), staged payload handles, mutation outcome
// resolution, session bootstrap, and store lifecycle.
//
// Envelope tag layout: operation arms occupy their canonical ledger tags;
// WikiId wiki_id takes the tag after the arm range (request and reply);
// request envelopes take MutationStamp stamp after that. Operation
// payloads never repeat the wiki scope.
syntax = "proto3";

package wikid.appdaemon.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "wikid/appdaemon/v1/common.proto";

option swift_prefix = "AppDaemon";

// ============================================================================
// Shared value types (referenced by multiple envelopes; grounded in
// Sources/WikiDaemonContract/DaemonStoreOps*.swift + WikiFSTypes).
// ============================================================================

// A committed staged-payload reference. Opaque bytes; the daemon binds it
// to session/instance/wiki/purpose.
message PayloadHandleRef {
  bytes id = 1;
}

// Mutation identity + optimistic epoch for ambiguous-write reconciliation.
message MutationStamp {
  bytes request_id = 1;
  uint64 expected_epoch = 2;
}

// === Chat identifiers & session values ===
message ChatTurnId { string value = 1; }
message ChatClaimId { string value = 1; }
message ChatTurnClaimId { string value = 1; }
message ChatCommandId { string value = 1; }
message ProviderSessionId { string value = 1; }
message AcpSessionId { string value = 1; }
message ThinkingOptionId { string value = 1; }
message ProviderId { string value = 1; }
message ModelId { string value = 1; }

message ChatAttachmentTarget {
  oneof target {
    PageId page = 1;
    SourceId source = 2;
    ChatId chat = 3;
  }
}

enum ChatKind {
  CHAT_KIND_UNSPECIFIED = 0;
  CHAT_KIND_EDIT = 1;
}

enum ChatMessageSummaryKind {
  CHAT_MESSAGE_SUMMARY_KIND_UNSPECIFIED = 0;
  CHAT_MESSAGE_SUMMARY_KIND_DEFAULT = 1;
  CHAT_MESSAGE_SUMMARY_KIND_MODEL = 2;
}

enum ChatTurnPersistenceState {
  CHAT_TURN_PERSISTENCE_STATE_UNSPECIFIED = 0;
  CHAT_TURN_PERSISTENCE_STATE_QUEUED = 1;
  CHAT_TURN_PERSISTENCE_STATE_CLAIMED = 2;
  CHAT_TURN_PERSISTENCE_STATE_PROVIDER_SUBMITTED = 3;
  CHAT_TURN_PERSISTENCE_STATE_COMPLETED = 4;
  CHAT_TURN_PERSISTENCE_STATE_CANCELLED = 5;
  CHAT_TURN_PERSISTENCE_STATE_FAILED = 6;
}

message ChatSummary {
  ChatId id = 1;
  ChatKind kind = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 message_count = 6;
  optional AcpSessionId acp_session_id = 7;
  optional ProviderId model_provider_id = 8;
  optional ModelId model_id = 9;
  optional ThinkingOptionId configured_thinking_option_id = 10;
  optional ThinkingOptionId effective_thinking_option_id = 11;
}

message ChatContextReference {
  oneof reference {
    PageId page = 1;
    SourceId source = 2;
    ChatId chat = 3;
  }
}
message StoreChatTurnSubmission {
  ChatCommandId command_id = 1;
  ChatTurnId turn_id = 2;
  string user_text = 3;
  repeated ChatContextReference context_references = 4;
  google.protobuf.Timestamp submitted_at = 5;
}
message ChatTranscriptCursor { int64 raw_value = 1; }
message ChatTurnUsageValues {
  optional int32 input_tokens = 1;
  optional int32 output_tokens = 2;
  optional int32 thought_tokens = 3;
  optional int32 cache_read_tokens = 4;
  optional int32 cache_write_tokens = 5;
  optional double cost = 6;
  optional string currency = 7;
}
message ChatTurnUsage {
  ChatTurnId turn_id = 1;
  optional ProviderId provider_id = 2;
  optional ModelId model_id = 3;
  optional google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp finished_at = 5;
  ChatTurnPersistenceState state = 6;
  optional int32 input_tokens = 7;
  optional int32 output_tokens = 8;
  optional int32 thought_tokens = 9;
  optional int32 cache_read_tokens = 10;
  optional int32 cache_write_tokens = 11;
  optional double cost = 12;
  optional string currency = 13;
}
message ChatUsageSummary {
  optional ChatTurnUsage latest_turn = 1;
  int32 input_tokens = 2;
  int32 output_tokens = 3;
  int32 thought_tokens = 4;
  int32 cache_read_tokens = 5;
  int32 cache_write_tokens = 6;
  optional double cost = 7;
  optional string currency = 8;
}
message PersistedChatTurn {
  ChatId chat_id = 1;
  int32 ordinal = 2;
  StoreChatTurnSubmission submission = 3;
  optional google.protobuf.Timestamp edited_at = 4;
  ChatTurnPersistenceState state = 5;
  optional ChatTurnClaimId claim_id = 6;
  optional google.protobuf.Timestamp claimed_at = 7;
  optional google.protobuf.Timestamp provider_submitted_at = 8;
  optional AcpSessionId provider_session_id = 9;
  optional string terminal_message = 10;
  optional ProviderId provider_id = 11;
  optional ModelId model_id = 12;
  optional google.protobuf.Timestamp finished_at = 13;
  ChatTurnUsageValues usage = 14;
}
message PersistedChatTranscriptItem {
  ChatTranscriptCursor cursor = 1;
  ChatTranscriptItem item = 2;
  optional string projected_event_json = 3;
  string projected_plain_text = 4;
  google.protobuf.Timestamp created_at = 5;
  optional string summary = 6;
}
message ChatTranscriptPage {
  repeated PersistedChatTranscriptItem items = 1;
  ChatTranscriptCursor checkpoint = 2;
  optional ChatTranscriptCursor next_cursor = 3;
}
message ChatMessage {
  PageId id = 1;
  ChatId chat_id = 2;
  int32 seq = 3;
  AgentEvent event = 4;
  google.protobuf.Timestamp created_at = 5;
  bool is_draft = 6;
}

