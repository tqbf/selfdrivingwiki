// === Extraction provenance and content detection ===
message ExtractionAlternative {
  SourceMarkdownVersion version = 1;
  string backend_display_name = 2;
  string agent_name = 3;
  optional string model_version = 4;
  int32 char_count = 5;
  optional ExtractorPackageProducer package = 6;
  bool is_active = 7;
}
message ExtractionHostSpeechProducer {
  string engine = 1;
  string locale_id = 2;
  ExtractorPackageProducer acquisition_fetcher = 3;
}
enum ExtractionProducerKind {
  EXTRACTION_PRODUCER_KIND_UNSPECIFIED = 0;
  EXTRACTION_PRODUCER_KIND_BACKEND = 1;
  EXTRACTION_PRODUCER_KIND_TOOL = 2;
  EXTRACTION_PRODUCER_KIND_LEGACY = 3;
  EXTRACTION_PRODUCER_KIND_INSTALLED_PACKAGE = 4;
  EXTRACTION_PRODUCER_KIND_HOST_SPEECH = 5;
}
message ExtractionProducer {
  ExtractionProducerKind kind = 1;
  optional string backend = 2;
  optional string tool = 3;
  optional string raw_technique = 4;
  optional ExtractorPackageProducer installed_package = 5;
  optional ExtractionHostSpeechProducer host_speech = 6;
}
message ExtractionProvenance {
  SourceMarkdownVersionId markdown_version_id = 1;
  SourceId source_id = 2;
  SourceMarkdownOrigin origin = 3;
  optional ExtractionProducer producer = 4;
  optional ProviderId provider_id = 5;
  optional ModelId model_id = 6;
  optional string tool_version = 7;
  google.protobuf.Timestamp created_at = 8;
  optional SourceVersionId source_version_id = 9;
}
message ExtractorPackageProducer {
  string package_id = 1;
  string version = 2;
  string digest = 3;
  string registration_id = 4;
  int32 protocol_revision = 5;
  ExtractorReportedMetadata reported_metadata = 6;
}
message ExtractorReportedMetadata {
  optional string tool_name = 1;
  optional string tool_version = 2;
  optional string model_name = 3;
  optional string model_version = 4;
  optional string language = 5;
  optional bool transcript_generated = 6;
}
message DeclaredMIME { string value = 1; DeclaredMIMEOrigin origin = 2; }
enum DeclaredMIMEOrigin {
  DECLARED_MIME_ORIGIN_UNSPECIFIED = 0;
  DECLARED_MIME_ORIGIN_HTTP_RESPONSE = 1;
  DECLARED_MIME_ORIGIN_SOURCE_METADATA = 2;
}
message ContentTypeDetectionHints {
  optional DeclaredMIME declared_mime = 1;
  optional string filename_extension = 2;
  optional string uti_mime = 3;
}
message ContentTypeEvidence {
  ContentTypeEvidenceOrigin origin = 1;
  string mime_type = 2;
  ContentTypeConfidence confidence = 3;
  optional string detail = 4;
}
enum ContentTypeEvidenceOrigin {
  CONTENT_TYPE_EVIDENCE_ORIGIN_UNSPECIFIED = 0;
  CONTENT_TYPE_EVIDENCE_ORIGIN_BINARY_SIGNATURE = 1;
  CONTENT_TYPE_EVIDENCE_ORIGIN_STRUCTURED_BYTES = 2;
  CONTENT_TYPE_EVIDENCE_ORIGIN_UTF8_TEXT = 3;
  CONTENT_TYPE_EVIDENCE_ORIGIN_HTTP_RESPONSE = 4;
  CONTENT_TYPE_EVIDENCE_ORIGIN_TRUSTED_GENERATED = 5;
  CONTENT_TYPE_EVIDENCE_ORIGIN_UTI = 6;
  CONTENT_TYPE_EVIDENCE_ORIGIN_FILENAME_EXTENSION = 7;
}
enum ContentTypeConfidence {
  CONTENT_TYPE_CONFIDENCE_UNSPECIFIED = 0;
  CONTENT_TYPE_CONFIDENCE_FALLBACK = 1;
  CONTENT_TYPE_CONFIDENCE_DECLARED = 2;
  CONTENT_TYPE_CONFIDENCE_PROBABLE = 3;
  CONTENT_TYPE_CONFIDENCE_HIGH = 4;
}
message ContentTypeConflict {
  ContentTypeConflictKind kind = 1;
  string chosen_mime_type = 2;
  ContentTypeEvidence conflicting_evidence = 3;
}
enum ContentTypeConflictKind {
  CONTENT_TYPE_CONFLICT_KIND_UNSPECIFIED = 0;
  CONTENT_TYPE_CONFLICT_KIND_DISAGREEMENT = 1;
  CONTENT_TYPE_CONFLICT_KIND_TRUSTED_GENERATED_MISMATCH = 2;
}
message ContentTypeDetectionResult {
  optional string normalized_mime_type = 1;
  repeated ContentTypeEvidence evidence = 2;
  optional ContentTypeConfidence confidence = 3;
  repeated ContentTypeConflict conflicts = 4;
  optional string structured_artifact_kind = 5;
}
enum MIMERepairNullState {
  MIME_REPAIR_NULL_STATE_UNSPECIFIED = 0;
  MIME_REPAIR_NULL_STATE_SOURCE_ONLY = 1;
  MIME_REPAIR_NULL_STATE_VERSION_ONLY = 2;
  MIME_REPAIR_NULL_STATE_BOTH = 3;
  MIME_REPAIR_NULL_STATE_NEITHER = 4;
}
enum MIMERepairStatus {
  MIME_REPAIR_STATUS_UNSPECIFIED = 0;
  MIME_REPAIR_STATUS_DETECTOR_REPAIR = 1;
  MIME_REPAIR_STATUS_PACKAGE_ALIAS_NORMALIZATION = 2;
  MIME_REPAIR_STATUS_CANONICAL_NO_OP = 3;
  MIME_REPAIR_STATUS_CONFLICT = 4;
  MIME_REPAIR_STATUS_AMBIGUITY = 5;
  MIME_REPAIR_STATUS_BYTELESS = 6;
  MIME_REPAIR_STATUS_INCONCLUSIVE = 7;
}
message MIMERepairItem {
  SourceId source_id = 1;
  SourceVersionId source_version_id = 2;
  string filename = 3;
  MIMERepairNullState null_state = 4;
  optional string old_source_mime_type = 5;
  optional string old_version_mime_type = 6;
  optional string new_mime_type = 7;
  ContentTypeDetectionResult detection = 8;
  MIMERepairStatus status = 9;
  bool updated = 10;
}
message MIMERepairReport {
  int32 scanned_count = 1;
  int32 repairable_count = 2;
  int32 updated_count = 3;
  int32 skipped_byteless_count = 4;
  int32 skipped_inconclusive_count = 5;
  bool applied = 6;
  repeated MIMERepairItem items = 7;
}

