    PageId page = 2;
    SourceId source = 3;
    ChatId chat = 4;
  }
}
message BookmarkNode {
  BookmarkId id = 1;
  optional BookmarkId parent_id = 2;
  int64 position = 3;
  BookmarkContent content = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
message WikiStrategyRevision { int64 raw_value = 1; }
message WikiStrategy {
  string name = 1;
  string instructions = 2;
  WikiStrategyRevision revision = 3;
  google.protobuf.Timestamp updated_at = 4;
}
message StrategySnapshot {
  optional WikiStrategy strategy = 1;
  optional WikiStrategyRevision revision = 2;
}
