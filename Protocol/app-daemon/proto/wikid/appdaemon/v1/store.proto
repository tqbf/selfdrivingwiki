// === Protected resource deletion ===
enum ResourceDeletionLinkPolicy {
  RESOURCE_DELETION_LINK_POLICY_UNSPECIFIED = 0;
  RESOURCE_DELETION_LINK_POLICY_PRESERVE = 1;
  RESOURCE_DELETION_LINK_POLICY_UNLINK = 2;
}
message ResourceDeletionTarget {
  oneof target {
    PageId page = 1;
    SourceId source = 2;
  }
}
message ResourceDeletionRequest {
  repeated ResourceDeletionTarget targets = 1;
  ResourceDeletionLinkPolicy link_policy = 2;
}
message DeletionLinkingPage { PageId page_id = 1; optional string title = 2; }
message DeletionBookmarkImpact { string node_id = 1; string folder_path = 2; }
message ProvenanceDeletionBlocker {
  SourceId source_id = 1;
  PageVersionId page_version_id = 2;
  PageId page_id = 3;
}
message DeletionImpact {
  repeated DeletionLinkingPage linking_pages = 1;
  repeated DeletionBookmarkImpact bookmarks = 2;
  repeated ProvenanceDeletionBlocker provenance_blockers = 3;
  int32 incoming_link_count = 4;
}
message ResourceDeletionResult {
  repeated ResourceDeletionTarget deleted_targets = 1;
  repeated PageId rewritten_page_ids = 2;
  repeated string removed_bookmark_ids = 3;
  int32 incoming_link_count = 4;
}

