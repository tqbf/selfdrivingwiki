// === OKF verification and trust metadata ===
message OKFVerificationId { string value = 1; }
enum OKFConceptStatus {
  OKF_CONCEPT_STATUS_UNSPECIFIED = 0;
  OKF_CONCEPT_STATUS_DRAFT = 1;
  OKF_CONCEPT_STATUS_STABLE = 2;
  OKF_CONCEPT_STATUS_DEPRECATED = 3;
}
enum OKFVerificationBasisKind {
  OKF_VERIFICATION_BASIS_KIND_UNSPECIFIED = 0;
  OKF_VERIFICATION_BASIS_KIND_HUMAN_REVIEW = 1;
  OKF_VERIFICATION_BASIS_KIND_SOURCE_CHECKED = 2;
  OKF_VERIFICATION_BASIS_KIND_EXTERNAL_REVALIDATION = 3;
}
message OKFVerificationBasis {
  int32 version = 1;
  OKFVerificationBasisKind kind = 2;
  repeated EvidenceReference evidence = 3;
  optional string note = 4;
  message EvidenceReference {
    oneof reference {
      SourceId source = 1;
      string external_url = 2;
    }
  }
}
message OKFVerificationCorrectionReason { int32 version = 1; string reason = 2; }
message OKFVerifierIdentity {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_HUMAN = 1;
    KIND_PROCESS = 2;
    KIND_PRODUCER = 3;
  }
  string raw_value = 1;
  Kind kind = 2;
  string name = 3;
  optional string version = 4;
}
message OKFFreshnessAnchor {
  oneof value {
    bool generated = 1;
    OKFVerificationId verification = 2;
    bool recorded_verification = 3;
  }
}
message OKFFreshnessPolicy {
  oneof policy {
    google.protobuf.Timestamp fixed = 1;
    Ttl ttl = 2;
  }
  message Ttl { int64 seconds = 1; OKFFreshnessAnchor anchor = 2; }
}
message OKFVerificationEvent {
  OKFVerificationId id = 1;
  OKFVerifierIdentity by = 2;
  google.protobuf.Timestamp verified_at = 3;
  OKFVerificationBasis basis = 4;
  optional google.protobuf.Timestamp removed_at = 5;
  optional ActivityId correction_activity_id = 6;
  optional OKFVerifierIdentity corrected_by = 7;
  optional OKFVerificationCorrectionReason correction_reason = 8;
}
message OKFConceptMetadata {
  optional OKFConceptStatus status = 1;
  optional google.protobuf.Timestamp stale_after = 2;
  optional OKFFreshnessPolicy freshness_policy = 3;
  repeated OKFVerificationEvent verifications = 4;
  int64 projection_revision = 5;
}
message PageOKFTrustMetadata {
  PageId page_id = 1;
  PageVersionId version_id = 2;
