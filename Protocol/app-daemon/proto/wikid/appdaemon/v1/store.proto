  CHAT_TURN_FAILURE_CATEGORY_RUNTIME_ERROR = 3;
  CHAT_TURN_FAILURE_CATEGORY_PERMISSION_DENIED = 4;
  CHAT_TURN_FAILURE_CATEGORY_TRANSPORT_ERROR = 5;
}
message ChatTranscriptItem {
  oneof item {
    ChatTranscriptMessageItem message = 1;
    ChatTranscriptToolCallItem tool_call = 2;
    ChatTranscriptSystemNoticeItem system_notice = 3;
    ChatTranscriptTurnFailureItem turn_failure = 4;
  }
