# Shared per-wiki composition. `_scope` is loader metadata removed before the
# plugin receives its config. Machine-specific rows are replaced by a final
# ambient overlay generated by the executable.
entries:
  - id: store
    plugin: wiki.store
    config: { _scope: wiki, databasePath: "${WIKI_DATABASE_PATH}", wikiID: "${WIKI_ID}" }
  - id: sessions
    plugin: wiki.sessions
    config: { _scope: wiki }
  - id: runtime-services
    plugin: wiki.runtime-services
    config: { _scope: wiki, wikiID: "${WIKI_ID}", containerDirectory: "${WIKI_HOME}" }
  - id: chats-persistence
    plugin: wiki.chats-persistence
    config: { _scope: wiki }
  - id: llm-runtime
    plugin: wiki.llm-runtime
    config: { _scope: wiki }
  - id: tools
    plugin: wiki.tools
    config: { _scope: wiki }
  - id: system-prompt
    plugin: wiki.system-prompt
    config: { _scope: wiki }
  - id: agent-loop
    plugin: wiki.agent-loop
    config: { _scope: wiki }
  - id: extraction
    plugin: wiki.extraction
    config: { _scope: wiki }
  - id: pdf2md
    plugin: wiki.extraction.pdf2md
    config: { _scope: wiki }
  - id: search
    plugin: wiki.search
    config: { _scope: wiki }
  - id: embeddings
    plugin: wiki.search.embeddings
    config: { _scope: wiki }
  - id: renderers
    plugin: wiki.renderers
    config: { _scope: wiki }
  - id: transport
    plugin: wiki.transport
    config: { _scope: wiki }
  - id: integrations
    plugin: wiki.integrations
    config: { _scope: wiki }
