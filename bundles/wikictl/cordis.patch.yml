entries:
  - id: search
    plugin: wiki.search
    config: { _scope: process }
  - id: tantivy
    plugin: wiki.search.tantivy
    config: { _scope: process }
  # Pin a disabled row in the committed profile so acceptance tests verify that
  # production resolution honors disabled data without mounting it.
  - id: transport
    plugin: wiki.transport
    config: { _scope: process }
    disabled: true
